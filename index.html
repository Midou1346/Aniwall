<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#070710" />
  <title>AniWalls ⚡ Anime Wallpapers</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Cairo:wght@400;600;700;800;900&display=swap"
    rel="stylesheet" />
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent
    }

    :root {
      color-scheme: dark;
      --bg: #070710;
      --panel: rgba(255, 255, 255, .045);
      --panel2: rgba(255, 255, 255, .09);
      --line: rgba(255, 255, 255, .09);
      --tx: #f1f0ff;
      --tx2: #a7a5c0;
      --tx3: #6f6d8f;
      --p1: #8b5cf6;
      --p2: #a855f7;
      --cyan: #22d3ee;
      --pink: #ec4899;
      --red: #f43f5e;
      --gold: #fbbf24;
      --grad: linear-gradient(135deg, #7c3aed, #a855f7 45%, #ec4899);
    }

    html,
    body {
      height: 100%
    }

    body {
      background: #030308;
      font-family: 'Cairo', 'Orbitron', sans-serif;
      color: var(--tx);
      display: flex;
      align-items: center;
      justify-content: center;
      -webkit-font-smoothing: antialiased
    }

    #root {
      width: 100%;
      display: flex;
      justify-content: center
    }

    .app {
      position: relative;
      width: 100%;
      max-width: 430px;
      height: 100dvh;
      background: var(--bg);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 0 0 90px rgba(124, 58, 237, .14)
    }

    @media(min-width:480px) {
      .app {
        height: min(920px, 94vh);
        border-radius: 34px;
        border: 1px solid var(--line)
      }
    }

    .app.night-off {
      filter: saturate(.85)
    }

    .app.night-off .bgfx {
      opacity: .35
    }

    .app.night-off .logo,
    .app.night-off .crown-btn {
      filter: none;
      box-shadow: none
    }

    /* background fx */
    .bgfx {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 0
    }

    .bgfx::before {
      content: '';
      position: absolute;
      width: 340px;
      height: 340px;
      border-radius: 50%;
      top: -90px;
      inset-inline-start: -90px;
      background: radial-gradient(circle, rgba(124, 58, 237, .30), transparent 65%)
    }

    .bgfx::after {
      content: '';
      position: absolute;
      width: 320px;
      height: 320px;
      border-radius: 50%;
      bottom: 60px;
      inset-inline-end: -110px;
      background: radial-gradient(circle, rgba(34, 211, 238, .16), transparent 65%)
    }

    .gridbg {
      position: absolute;
      inset: 0;
      background-image: linear-gradient(rgba(255, 255, 255, .025) 1px, transparent 1px), linear-gradient(90deg, rgba(255, 255, 255, .025) 1px, transparent 1px);
      background-size: 34px 34px;
      -webkit-mask-image: linear-gradient(#000 5%, transparent 62%);
      mask-image: linear-gradient(#000 5%, transparent 62%)
    }

    /* header */
    .hdr {
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 14px 16px 10px;
      z-index: 5
    }

    .icon-btn {
      width: 38px;
      height: 38px;
      border-radius: 12px;
      background: var(--panel);
      border: 1px solid var(--line);
      color: var(--tx);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: .2s;
      flex: 0 0 auto
    }

    .icon-btn:active {
      transform: scale(.9)
    }

    .icon-btn.sm {
      width: 32px;
      height: 32px;
      border-radius: 10px
    }

    .icon-btn.danger {
      color: var(--red)
    }

    .icon-btn.favd {
      color: var(--red) !important;
      border-color: rgba(244, 63, 94, .6) !important;
      box-shadow: 0 0 14px rgba(244, 63, 94, .4)
    }

    .logo {
      font-family: 'Orbitron', 'Cairo', sans-serif;
      font-weight: 900;
      font-size: 20px;
      letter-spacing: 1px;
      background: linear-gradient(90deg, #c4b5fd, #22d3ee);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      filter: drop-shadow(0 0 12px rgba(139, 92, 246, .55));
      margin-inline-end: auto
    }

    .lang-btn {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 8px 12px;
      border-radius: 999px;
      background: var(--panel);
      border: 1px solid var(--line);
      font-weight: 800;
      font-size: 12.5px;
      color: var(--cyan);
      cursor: pointer;
      font-family: inherit;
      transition: .2s
    }

    .lang-btn:active {
      transform: scale(.93)
    }

    .crown-btn {
      color: var(--gold);
      border-color: rgba(251, 191, 36, .3);
      box-shadow: 0 0 10px rgba(251, 191, 36, .2)
    }

    /* content */
    .content {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 0 16px 22px;
      position: relative;
      z-index: 1;
      scrollbar-width: none
    }

    .content::-webkit-scrollbar {
      display: none
    }

    .pg {
      animation: fadeUp .35s both
    }

    .sec {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 22px 2px 12px
    }

    .sec h3 {
      font-size: 15.5px;
      font-weight: 800
    }

    .sec .more {
      color: var(--p2);
      font-size: 12px;
      font-weight: 800;
      cursor: pointer
    }

    /* hero */
    .hero {
      position: relative;
      height: 300px;
      border-radius: 24px;
      overflow: hidden;
      border: 1px solid var(--line);
      margin-top: 6px;
      background: #0b0b18
    }

    .hero-slide {
      position: absolute;
      inset: 0;
      opacity: 0;
      transform: scale(1.06);
      transition: opacity .8s, transform .8s
    }

    .hero-slide.on {
      opacity: 1;
      transform: scale(1)
    }

    .hero-slide img {
      width: 100%;
      height: 100%;
      object-fit: cover
    }

    .hero-shade {
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, rgba(5, 5, 12, .95) 8%, rgba(5, 5, 12, .2) 55%, rgba(5, 5, 12, .35))
    }

    .hero-txt {
      position: absolute;
      inset-inline: 0;
      bottom: 0;
      padding: 20px;
      animation: fadeUp .5s both
    }

    .hero-badge {
      display: inline-block;
      background: rgba(124, 58, 237, .28);
      border: 1px solid rgba(168, 85, 247, .5);
      backdrop-filter: blur(4px);
      color: #d8ccff;
      font-size: 9.5px;
      font-weight: 800;
      letter-spacing: 1px;
      padding: 5px 11px;
      border-radius: 99px;
      margin-bottom: 10px
    }

    .hero-title {
      font-family: 'Orbitron', 'Cairo', sans-serif;
      font-size: 25px;
      line-height: 1.25;
      font-weight: 900;
      text-shadow: 0 2px 18px rgba(0, 0, 0, .6)
    }

    .hero-title .g {
      background: var(--grad);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent
    }

    .hero-sub {
      color: #c9c7dd;
      font-size: 12.5px;
      margin: 6px 0 14px;
      font-weight: 600
    }

    .cta {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      background: var(--grad);
      color: #fff;
      border: none;
      border-radius: 999px;
      padding: 11px 20px;
      font-family: inherit;
      font-size: 12.5px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 8px 24px rgba(139, 92, 246, .5);
      transition: .2s
    }

    .cta:active {
      transform: scale(.95)
    }

    .hero-dots {
      position: absolute;
      bottom: 13px;
      inset-inline-end: 16px;
      display: flex;
      gap: 5px;
      z-index: 3
    }

    .dot {
      width: 6px;
      height: 6px;
      border-radius: 99px;
      background: rgba(255, 255, 255, .3);
      cursor: pointer;
      transition: .3s
    }

    .dot.on {
      width: 18px;
      background: var(--p2)
    }

    /* categories */
    .hscroll {
      display: flex;
      gap: 12px;
      overflow-x: auto;
      padding: 2px 2px 8px;
      scrollbar-width: none
    }

    .hscroll::-webkit-scrollbar {
      display: none
    }

    .cat {
      min-width: 80px;
      height: 86px;
      border-radius: 18px;
      background: var(--panel);
      border: 1px solid var(--line);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 7px;
      cursor: pointer;
      flex: 0 0 auto;
      transition: .2s
    }

    .cat:active {
      transform: scale(.93)
    }

    .cat .em {
      font-size: 24px;
      filter: drop-shadow(0 0 8px rgba(139, 92, 246, .6))
    }

    .cat span {
      font-size: 10.5px;
      color: var(--tx2);
      font-weight: 700
    }

    /* cards */
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px
    }

    .grid .wcard {
      height: 225px
    }

    .wcard {
      position: relative;
      border-radius: 18px;
      overflow: hidden;
      border: 1px solid var(--line);
      cursor: pointer;
      transition: .25s;
      background: #0b0b18
    }

    .wcard:active {
      transform: scale(.965)
    }

    .wcard.wide {
      width: 255px;
      height: 150px;
      flex: 0 0 auto
    }

    .wcard img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 1
    }

    .wgrad {
      position: absolute;
      inset: 0
    }

    .wshade {
      position: absolute;
      inset: 0;
      z-index: 2;
      background: linear-gradient(to top, rgba(4, 4, 10, .9), transparent 55%)
    }

    .badges {
      position: absolute;
      top: 8px;
      inset-inline-start: 8px;
      z-index: 4;
      display: flex;
      flex-direction: column;
      gap: 5px;
      align-items: flex-start
    }

    .b4k {
      font-family: 'Orbitron', sans-serif;
      font-size: 8.5px;
      font-weight: 800;
      background: var(--grad);
      padding: 3px 7px;
      border-radius: 6px;
      color: #fff;
      letter-spacing: .5px
    }

    .bnew {
      font-size: 8px;
      font-weight: 800;
      background: rgba(34, 211, 238, .18);
      border: 1px solid rgba(34, 211, 238, .5);
      color: var(--cyan);
      padding: 2.5px 7px;
      border-radius: 6px;
      animation: pulse 1.6s infinite;
      letter-spacing: .5px
    }

    .heart-btn,
    .wdl {
      position: absolute;
      z-index: 4;
      width: 30px;
      height: 30px;
      border-radius: 99px;
      background: rgba(10, 10, 20, .55);
      backdrop-filter: blur(6px);
      border: 1px solid rgba(255, 255, 255, .16);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      cursor: pointer;
      transition: .2s
    }

    .heart-btn {
      top: 8px;
      inset-inline-end: 8px
    }

    .heart-btn.fav {
      color: var(--red);
      border-color: rgba(244, 63, 94, .55);
      box-shadow: 0 0 12px rgba(244, 63, 94, .45)
    }

    .heart-btn:active,
    .wdl:active {
      transform: scale(.85)
    }

    .wdl {
      bottom: 42px;
      inset-inline-end: 8px;
      color: var(--cyan)
    }

    .wmeta {
      position: absolute;
      bottom: 0;
      inset-inline: 0;
      z-index: 3;
      padding: 10px
    }

    .wtitle {
      font-size: 12.5px;
      font-weight: 800;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis
    }

    .wsub {
      font-size: 10px;
      color: #b6b4cf;
      margin-top: 2px
    }

    /* gradients */
    .g1 {
      background: linear-gradient(135deg, #1e1b4b, #7c3aed 55%, #22d3ee)
    }

    .g2 {
      background: linear-gradient(150deg, #0f172a, #f43f5e 60%, #fb923c)
    }

    .g3 {
      background: linear-gradient(135deg, #111, #dc2626 70%, #7c3aed)
    }

    .g4 {
      background: linear-gradient(140deg, #164e63, #22d3ee 55%, #a855f7)
    }

    .g5 {
      background: linear-gradient(135deg, #052e16, #22c55e 60%, #0ea5e9)
    }

    .g6 {
      background: linear-gradient(140deg, #4a044e, #ec4899 55%, #f59e0b)
    }

    /* search */
    .search-bar {
      display: flex;
      align-items: center;
      gap: 9px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 0 14px;
      margin-top: 10px;
      transition: .2s
    }

    .search-bar:focus-within {
      border-color: var(--p2);
      box-shadow: 0 0 0 3px rgba(168, 85, 247, .15)
    }

    .sb-ic {
      color: var(--tx3)
    }

    .s-inp {
      flex: 1;
      background: none;
      border: none;
      outline: none;
      color: var(--tx);
      font-family: inherit;
      font-size: 13.5px;
      padding: 14px 0;
      min-width: 0
    }

    .s-inp::placeholder {
      color: var(--tx3)
    }

    .s-clear {
      background: none;
      border: none;
      color: var(--tx3);
      cursor: pointer;
      display: flex
    }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 8px 0 4px
    }

    .chip {
      background: var(--panel);
      border: 1px solid var(--line);
      color: var(--tx2);
      border-radius: 12px;
      padding: 9px 14px;
      font-family: inherit;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      transition: .2s;
      display: inline-flex;
      align-items: center;
      gap: 5px
    }

    .chip.on {
      background: linear-gradient(135deg, rgba(124, 58, 237, .4), rgba(236, 72, 153, .28));
      border-color: rgba(168, 85, 247, .55);
      color: #fff;
      box-shadow: 0 0 14px rgba(139, 92, 246, .25)
    }

    .chip:active {
      transform: scale(.94)
    }

    .lbl {
      font-size: 11.5px;
      color: var(--tx2);
      font-weight: 800;
      margin: 14px 0 2px;
      display: block
    }

    /* page head / empty */
    .page-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 14px 2px
    }

    .page-head h2 {
      font-size: 19px;
      font-weight: 900
    }

    .count {
      font-size: 11px;
      color: var(--tx2);
      background: var(--panel);
      border: 1px solid var(--line);
      padding: 5px 11px;
      border-radius: 99px
    }

    .empty {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 60px 20px;
      gap: 6px
    }

    .empty-ic {
      font-size: 52px;
      filter: drop-shadow(0 0 18px rgba(139, 92, 246, .5))
    }

    .empty p {
      font-weight: 800;
      font-size: 15px
    }

    .empty span {
      color: var(--tx2);
      font-size: 12px;
      max-width: 250px
    }

    /* daily */
    .daily-card {
      border-radius: 24px;
      overflow: hidden;
      border: 1px solid var(--line);
      background: var(--panel)
    }

    .dc-img {
      height: 340px;
      position: relative
    }

    .dc-body {
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      align-items: stretch
    }

    .dc-body h3 {
      font-size: 17px
    }

    .countdown {
      margin-top: 16px;
      text-align: center;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 20px;
      padding: 16px
    }

    .cd-lbl {
      font-size: 11.5px;
      color: var(--tx2);
      font-weight: 700;
      margin-bottom: 10px
    }

    .cd-row {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px
    }

    .cd-box {
      background: rgba(124, 58, 237, .15);
      border: 1px solid rgba(168, 85, 247, .3);
      border-radius: 14px;
      padding: 8px 0;
      width: 64px
    }

    .cd-box b {
      font-family: 'Orbitron', sans-serif;
      font-size: 20px;
      color: #c4b5fd;
      display: block
    }

    .cd-box span {
      font-size: 9px;
      color: var(--tx2)
    }

    .cd-sep {
      font-family: 'Orbitron', sans-serif;
      font-size: 18px;
      color: var(--p2)
    }

    /* detail */
    .detail {
      position: absolute;
      inset: 0;
      background: #05050d;
      z-index: 60;
      animation: fade .3s
    }

    .d-grad {
      position: absolute;
      inset: 0
    }

    .d-img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 1
    }

    .d-shade {
      position: absolute;
      inset: 0;
      z-index: 2;
      background: linear-gradient(to bottom, rgba(4, 4, 10, .55), transparent 28%, transparent 52%, rgba(4, 4, 10, .94) 85%);
      pointer-events: none
    }

    .d-top {
      position: absolute;
      top: 0;
      inset-inline: 0;
      z-index: 5;
      display: flex;
      justify-content: space-between;
      padding: 14px 16px
    }

    .d-top>div {
      display: flex;
      gap: 8px
    }

    .d-sheet {
      position: absolute;
      bottom: 0;
      inset-inline: 0;
      z-index: 5;
      padding: 10px 16px calc(20px + env(safe-area-inset-bottom));
      display: flex;
      flex-direction: column;
      gap: 12px
    }

    .d-title-row {
      display: flex;
      align-items: center;
      gap: 10px
    }

    .d-title-row h3 {
      font-size: 19px;
      flex: 1;
      text-shadow: 0 2px 12px rgba(0, 0, 0, .6)
    }

    .dmeta {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px
    }

    .dcell {
      background: rgba(14, 14, 28, .72);
      backdrop-filter: blur(8px);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 9px 4px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px
    }

    .dcell b {
      font-size: 10.5px;
      font-weight: 800;
      max-width: 100%;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis
    }

    .dcell span {
      font-size: 8px;
      color: var(--tx2)
    }

    /* buttons / inputs */
    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 16px;
      font-family: inherit;
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
      transition: .2s
    }

    .btn:active {
      transform: scale(.97)
    }

    .btn:disabled {
      opacity: .6;
      cursor: wait
    }

    .btn-grad {
      background: var(--grad);
      color: #fff;
      box-shadow: 0 8px 26px rgba(139, 92, 246, .45)
    }

    .btn-ghost {
      background: var(--panel);
      border: 1px solid var(--line);
      color: var(--tx)
    }

    .inp {
      width: 100%;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 12px 14px;
      color: var(--tx);
      font-family: inherit;
      font-size: 13px;
      outline: none;
      transition: .2s
    }

    .inp:focus {
      border-color: var(--p2);
      box-shadow: 0 0 0 3px rgba(168, 85, 247, .15)
    }

    .inp.code {
      text-align: center;
      font-family: 'Orbitron', sans-serif;
      letter-spacing: 6px;
      font-size: 16px
    }

    .cy {
      color: var(--cyan)
    }

    .gold {
      color: var(--gold)
    }

    /* bottom nav */
    .bnav {
      display: flex;
      border-top: 1px solid var(--line);
      background: rgba(10, 10, 20, .88);
      backdrop-filter: blur(14px);
      padding: 8px 6px calc(10px + env(safe-area-inset-bottom));
      z-index: 6
    }

    .bnav button {
      flex: 1;
      background: none;
      border: none;
      color: var(--tx3);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      font-size: 9px;
      font-weight: 800;
      font-family: inherit;
      cursor: pointer;
      position: relative;
      transition: .2s;
      white-space: nowrap;
      padding-top: 4px
    }

    .bnav button.on {
      color: var(--p2)
    }

    /* ============ app root ============ */
    function App() {
      const [lang, setLang] = useState(() => store.get('aw_lang', 'en'));
      const [page, setPage] = useState('home');
      const [wallpapers, setWallpapers] = useState(() => store.get('aw_wps_v2', null) || SEED);
      const [favs, setFavs] = useState(() => store.get('aw_favs', []));
      const [myDls, setMyDls] = useState(() => store.get('aw_dl', []));
      const [name, setName] = useState(() => store.get('aw_name', ''));
      const [night, setNight] = useState(() => store.get('aw_night', true));
      const [isAdmin, setIsAdmin] = useState(() => store.get('aw_admin', 0) === 1);
      const [showAdmin, setShowAdmin] = useState(false);
      const [loginOpen, setLoginOpen] = useState(false);
      const [detail, setDetail] = useState(null);
      const [drawer, setDrawer] = useState(false);
      const [sheet, setSheet] = useState(null);
      const [toast, setToast] = useState(null);
      const [downloading, setDownloading] = useState(false);
      const [query, setQuery] = useState('');
      const [activeCat, setActiveCat] = useState('');
      const [activeTag, setActiveTag] = useState('all');
      const toastT = useRef(null);
      const scrollRef = useRef(null);
      const crownTaps = useRef({ n: 0, t: 0 });
      const t = I18N[lang];

      useEffect(() => { store.set('aw_lang', lang); document.documentElement.lang = lang; document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr'; }, [lang]);
      useEffect(() => { store.set('aw_wps_v2', wallpapers) }, [wallpapers]);
      useEffect(() => { store.set('aw_favs', favs) }, [favs]);
      useEffect(() => { store.set('aw_dl', myDls) }, [myDls]);
      useEffect(() => { store.set('aw_name', name) }, [name]);
      useEffect(() => { store.set('aw_night', night) }, [night]);
      useEffect(() => {
        const h = e => { if (e.key === 'Escape') { setDetail(null); setDrawer(false); setLoginOpen(false); setSheet(null); setShowAdmin(false); } };
        window.addEventListener('keydown', h); return () => window.removeEventListener('keydown', h);
      }, []);

      const notify = msg => { clearTimeout(toastT.current); setToast({ msg, id: Date.now() }); toastT.current = setTimeout(() => setToast(null), 2400); };
      const go = p => { setPage(p); setDrawer(false); if (scrollRef.current) scrollRef.current.scrollTop = 0; };
      const openDetail = w => { setDetail(w); setDrawer(false); };
      const isFav = id => favs.includes(id);

      function toggleFav(w) {
        const has = favs.includes(w.id);
        setFavs(f => has ? f.filter(x => x !== w.id) : [...f, w.id]);
        notify(has ? t.toast.favRemove : t.toast.favAdd);
      }
      function bumpDls(id) { setWallpapers(ws => ws.map(w => w.id === id ? { ...w, dls: (w.dls || 0) + 1 } : w)); }
      async function download(wp) {
        if (downloading) return;
        setDownloading(true);
        const base = (lang === 'ar' ? wp.tar : wp.ten).replace(/[^\p{L}\p{N}]+/gu, '-');
        const fname = base + '-' + wp.res.replace(/\s/g, '') + '.jpg';
        try {
          const res = await fetch(wp.img, { mode: 'cors' });
          const b = await res.blob();
          const url = URL.createObjectURL(b);
          const a = document.createElement('a');
          a.href = url; a.download = fname;
          document.body.appendChild(a); a.click(); a.remove();
          setTimeout(() => URL.revokeObjectURL(url), 4000);
          notify(t.detail.downloadOk);
        } catch (e) {
          const a = document.createElement('a');
          a.href = wp.img; a.download = fname; a.target = '_blank'; a.rel = 'noopener';
          document.body.appendChild(a); a.click(); a.remove();
          notify(t.detail.downloadTry);
        }
        bumpDls(wp.id);
        setMyDls(m => [{ id: wp.id, at: Date.now() }, ...m].slice(0, 60));
        setDownloading(false);
      }
      async function shareWall(wp) {
        const url = wp.img.startsWith('data:') ? location.href : wp.img;
        try {
          if (navigator.share) { await navigator.share({ title: 'AniWalls ⚡', text: (lang === 'ar' ? wp.tar : wp.ten) + ' — AniWalls', url }); return; }
          throw 0;
        } catch (e) {
          try { await navigator.clipboard.writeText(url); notify(t.detail.shared); } catch (_) { notify(t.toast.copied); }
        }
      }
      async function shareApp() {
        try {
          if (navigator.share) { await navigator.share({ title: 'AniWalls ⚡', text: t.about.body, url: location.href }); return; }
          throw 0;
        } catch (e) {
          try { await navigator.clipboard.writeText(location.href); notify(t.toast.copied); } catch (_) { }
        }
      }
      function onCrown() {
        if (isAdmin) { setShowAdmin(true); return; }
        const now = Date.now(), c = crownTaps.current;
        if (now - c.t > 1600) c.n = 0;
        c.t = now; c.n++;
        if (c.n >= 3) { c.n = 0; setLoginOpen(true); }
      }
      function langToggle() {
        const nl = lang === 'en' ? 'ar' : 'en';
        setLang(nl);
        notify(nl === 'en' ? 'Language: English' : 'اللغة: العربية');
      }
      function publishWallpaper(wp) { setWallpapers(ws => [wp, ...ws]); }
      function deleteWallpaper(id) {
        setWallpapers(ws => ws.filter(w => w.id !== id));
        setFavs(f => f.filter(x => x !== id));
        setMyDls(m => m.filter(x => x.id !== id));
      }
      function onSuccessLogin() {
        setIsAdmin(true); store.set('aw_admin', 1);
        setLoginOpen(false); setShowAdmin(true);
        notify(t.toast.adminIn);
      }
      function onLogoutAdmin() {
        setIsAdmin(false); store.set('aw_admin', 0);
        setShowAdmin(false); notify(t.toast.adminOut);
      }
      const adminAction = isAdmin ? () => { setDrawer(false); setShowAdmin(true); } : () => { setDrawer(false); setLoginOpen(true); };

      return <div className={'app' + (lang === 'ar' ? '' : '') + (night ? '' : ' night-off')}>
        <div className="bgfx"><div className="gridbg" /></div>
        <Header t={t} lang={lang} onMenu={() => setDrawer(true)} onLang={langToggle} onCrown={onCrown} />
        <main className="content" ref={scrollRef} key={page}>
          {page === 'home' && <HomePage t={t} lang={lang} wps={wallpapers} openDetail={openDetail} toggleFav={toggleFav} isFav={isFav} download={download} go={go}
            setCatFilter={k => { setActiveCat(k); setQuery(''); setActiveTag('all'); go('search'); }} />}
          {page === 'search' && <SearchPage t={t} lang={lang} wps={wallpapers} query={query} setQuery={setQuery} activeCat={activeCat} setActiveCat={setActiveCat}
            activeTag={activeTag} setActiveTag={setActiveTag} openDetail={openDetail} toggleFav={toggleFav} isFav={isFav} download={download} />}
          {page === 'favorites' && <FavoritesPage t={t} lang={lang} wps={wallpapers} favs={favs} openDetail={openDetail} toggleFav={toggleFav} download={download} go={go} />}
          {page === 'daily' && <DailyPage t={t} lang={lang} wps={wallpapers} download={download} downloading={downloading} />}
          {page === 'profile' && <ProfilePage t={t} lang={lang} name={name} isAdmin={isAdmin} myDlsCount={myDls.length} favsCount={favs.length} go={go}
            openSheet={setSheet} langToggle={langToggle} night={night} setNight={setNight} shareApp={shareApp} notify={notify} openAdmin={() => setShowAdmin(true)} />}
        </main>
        <BottomNav t={t} page={page} go={go} />

        {drawer && <Drawer t={t} onClose={() => setDrawer(false)} go={go} shareApp={shareApp} adminAction={adminAction} onAbout={() => { setDrawer(false); setSheet('about'); }} />}
        {detail && <Detail t={t} lang={lang} wp={detail} fav={isFav(detail.id)} onClose={() => setDetail(null)}
          onFav={() => toggleFav(detail)} onDownload={() => download(detail)} onShare={() => shareWall(detail)} downloading={downloading} />}
        {sheet === 'downloads' && <Sheet title={'⬇ ' + t.profile.menu.myDownloads} onClose={() => setSheet(null)}>
          {myDls.length === 0 ? <div className="empty" style={{ padding: '26px 10px' }}><p>{t.dlEmpty}</p></div> :
            myDls.map(d => {
              const w = wallpapers.find(x => x.id === d.id);
              if (!w) return null;
              return <div key={d.id} className="dlrow">
                <img src={w.img} onError={e => { e.target.style.visibility = 'hidden' }} />
                <div className="dlmeta"><b>{lang === 'ar' ? w.tar : w.ten}</b><span>{w.res}</span></div>
                <button className="icon-btn sm" onClick={() => download(w)}><Ic n="download" s={14} /></button>
              </div>;
            })}
        </Sheet>}
        {sheet === 'about' && <Sheet title={t.about.title} onClose={() => setSheet(null)}>
          <p style={{ fontSize: 12.5, color: 'var(--tx2)', lineHeight: 1.9 }}>{t.about.body}</p>
          <div style={{ textAlign: 'center', marginTop: 14 }}><span className="pill">AniWalls v2.0 • 👑 Mido © 2026</span></div>
        </Sheet>}
        {sheet === 'edit' && <EditSheet t={t} current={name || t.profile.name} onClose={() => setSheet(null)}
          onSave={v => { setName(v); setSheet(null); notify(t.toast.nameSaved); }} />}
        {loginOpen && <AdminLogin t={t} onClose={() => setLoginOpen(false)} onSuccess={onSuccessLogin} />}
        {showAdmin && isAdmin && <AdminPanel t={t} lang={lang} wps={wallpapers} onClose={() => setShowAdmin(false)} onLogout={onLogoutAdmin}
          onPublish={publishWallpaper} onDelete={deleteWallpaper} notify={notify} />}
        {toast && <div key={toast.id} className="toast">{toast.msg}</div>}
      </div>;
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>

</html>
